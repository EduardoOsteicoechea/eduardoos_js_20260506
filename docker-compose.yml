# Stack name in Docker Desktop (Compose project name).
# Note: Docker only allows [a-z0-9_-], so "eduardoos.com" must be "eduardoos-com".
name: eduardoos-com

services:
  s3api:
    build:
      context: ./s3
      dockerfile: Dockerfile
    container_name: eduardoos-s3api
    environment:
      PORT: 8130
      BIND_HOST: 0.0.0.0
      S3_INTERNAL_TOKEN: dev-internal-s3-token
      POSTS_DB_URL: http://postsdb:8120
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ROOT_PREFIX: ${S3_ROOT_PREFIX:-media}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    expose:
      - "8130"
    restart: unless-stopped

  postsdb:
    profiles: ["local-db"]
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: eduardoos-postsdb
    environment:
      PORT: 8120
      BIND_HOST: 0.0.0.0
      DATA_STORE: ${DATA_STORE:-dynamodb}
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DYNAMODB_CATALOG_TABLE: ${DYNAMODB_CATALOG_TABLE:-eduardoos_catalog}
      DYNAMODB_POSTS_TABLE: ${DYNAMODB_POSTS_TABLE:-eduardoos_posts}
      DYNAMODB_USERS_TABLE: ${DYNAMODB_USERS_TABLE:-eduardoos_users}
      DYNAMODB_REFRESH_TOKENS_TABLE: ${DYNAMODB_REFRESH_TOKENS_TABLE:-eduardoos_refresh_tokens}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # SQLite fallback: set DATA_STORE=sqlite and mount ./database/data
      DB_PATH: /data/posts.db
    volumes:
      - ./database/data:/data
    expose:
      - "8120"
    restart: unless-stopped

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: eduardoos-chatbot
    env_file:
      - ./chatbot/.env
    environment:
      PORT: 8110
      BIND_HOST: 0.0.0.0
      CHATBOT_INTERNAL_TOKEN: dev-internal-chatbot-token
      CHATBOT_PUBLIC_AUTH_ENABLED: "false"
      POSTS_DB_URL: http://postsdb:8120
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
    expose:
      - "8110"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduardoos-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      SERIES_DATA_ROOT: /app/public/data/series
      DOCUMENTER_URL: http://documenter:8090
      CHATBOT_URL: http://chatbot:8110
      CHATBOT_INTERNAL_TOKEN: dev-internal-chatbot-token
      CHATBOT_PUBLIC_AUTH_ENABLED: "false"
      POSTS_DB_URL: http://postsdb:8120
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
      S3_URL: http://s3api:8130
      S3_INTERNAL_TOKEN: dev-internal-s3-token
    ports:
      - "8080:8080"
    volumes:
      - ./backend/public/data:/app/public/data
    depends_on:
      - s3api
      - chatbot
    restart: unless-stopped

  documenter:
    build:
      context: ./documenter
      dockerfile: Dockerfile
    container_name: eduardoos-documenter
    environment:
      PORT: 8090
      S3_URL: http://s3api:8130
      S3_INTERNAL_TOKEN: dev-internal-s3-token
      POSTS_DB_URL: http://postsdb:8120
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
    volumes:
      - ./documenter/public/data:/app/public/data
    ports:
      - "8090:8090"
    depends_on:
      - s3api
    restart: unless-stopped

  telemetry:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
    container_name: eduardoos-telemetry
    environment:
      PORT: 8100
      LOG_MODE: docker
      LOG_LINES: 80
      DOCKER_BACKEND_CONTAINER: eduardoos-backend
      DOCKER_DOCUMENTER_CONTAINER: eduardoos-documenter
      BACKEND_HEALTH_URL: http://backend:8080/api/series/catalog
      DOCUMENTER_HEALTH_URL: http://documenter:8090/health
      CHATBOT_HEALTH_URL: http://chatbot:8110/health
      S3_HEALTH_URL: http://s3api:8130/health
      S3_UNIT: eduardoos-s3api
      S3_PORT: 8130
      DOCKER_S3_CONTAINER: eduardoos-s3api
      CHATBOT_UNIT: eduardoos-chatbot
      CHATBOT_PORT: 8110
      DOCKER_CHATBOT_CONTAINER: eduardoos-chatbot
      HOST_PROC: /host/proc
      DISK_PATH: /
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    ports:
      - "8100:8100"
    depends_on:
      - backend
      - documenter
      - chatbot
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: ${PRODUCTION_API_BASE:-https://eduardoos.com}
        PUBLIC_DOCUMENTER_BASE: http://documenter:8090
    container_name: eduardoos-frontend
    environment:
      PUBLIC_API_BASE: ${PRODUCTION_API_BASE:-https://eduardoos.com}
      DEV_API_PROXY: ${DEV_API_PROXY:-https://eduardoos.com}
      PUBLIC_DOCUMENTER_BASE: http://documenter:8090
      PUBLIC_TELEMETRY_BASE: http://telemetry:8100
    depends_on:
      - backend
      - documenter
      - chatbot
      - telemetry
      - s3api
    ports:
      - "4321:4321"
    restart: unless-stopped
