# Stack name in Docker Desktop (Compose project name).
# Note: Docker only allows [a-z0-9_-], so "eduardoos.com" must be "eduardoos-com".
name: eduardoos-com

services:
  postsdb:
    profiles: ["local-db"]
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: eduardoos-postsdb
    environment:
      PORT: 8120
      BIND_HOST: 0.0.0.0
      DB_PATH: /data/posts.db
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
    volumes:
      - ./database/posts.db:/data/posts.db
    expose:
      - "8120"
    restart: unless-stopped

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: eduardoos-chatbot
    env_file:
      - ./chatbot/.env
    environment:
      PORT: 8110
      BIND_HOST: 0.0.0.0
      CHATBOT_INTERNAL_TOKEN: dev-internal-chatbot-token
      CHATBOT_PUBLIC_AUTH_ENABLED: "false"
    expose:
      - "8110"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduardoos-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      SERIES_DATA_ROOT: /app/public/data/series
      DOCUMENTER_URL: http://documenter:8090
      CHATBOT_URL: http://chatbot:8110
      CHATBOT_INTERNAL_TOKEN: dev-internal-chatbot-token
      CHATBOT_PUBLIC_AUTH_ENABLED: "false"
      POSTS_DB_URL: http://postsdb:8120
      POSTS_DB_INTERNAL_TOKEN: dev-internal-posts-db-token
    ports:
      - "8080:8080"
    volumes:
      - ./backend/public/data:/app/public/data
    depends_on:
      - chatbot
    restart: unless-stopped

  documenter:
    build:
      context: ./documenter
      dockerfile: Dockerfile
    container_name: eduardoos-documenter
    environment:
      PORT: 8090
    volumes:
      - ./documenter/public/data:/app/public/data
    ports:
      - "8090:8090"
    restart: unless-stopped

  telemetry:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
    container_name: eduardoos-telemetry
    environment:
      PORT: 8100
      LOG_MODE: docker
      LOG_LINES: 80
      DOCKER_BACKEND_CONTAINER: eduardoos-backend
      DOCKER_DOCUMENTER_CONTAINER: eduardoos-documenter
      BACKEND_HEALTH_URL: http://backend:8080/api/series/catalog
      DOCUMENTER_HEALTH_URL: http://documenter:8090/health
      CHATBOT_HEALTH_URL: http://chatbot:8110/health
      CHATBOT_UNIT: eduardoos-chatbot
      CHATBOT_PORT: 8110
      DOCKER_CHATBOT_CONTAINER: eduardoos-chatbot
      HOST_PROC: /host/proc
      DISK_PATH: /
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    ports:
      - "8100:8100"
    depends_on:
      - backend
      - documenter
      - chatbot
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: ${PRODUCTION_API_BASE:-https://eduardoos.com}
        PUBLIC_DOCUMENTER_BASE: http://documenter:8090
    container_name: eduardoos-frontend
    environment:
      PUBLIC_API_BASE: ${PRODUCTION_API_BASE:-https://eduardoos.com}
      DEV_API_PROXY: ${DEV_API_PROXY:-https://eduardoos.com}
      PUBLIC_DOCUMENTER_BASE: http://documenter:8090
      PUBLIC_TELEMETRY_BASE: http://telemetry:8100
    depends_on:
      - backend
      - documenter
      - chatbot
      - telemetry
    ports:
      - "4321:4321"
    restart: unless-stopped
