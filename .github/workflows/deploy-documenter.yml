name: Deploy Documenter to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'documenter/**'
      - 'deploy/systemd/eduardoos-documenter.service'
      - '.github/workflows/deploy-documenter.yml'
  workflow_dispatch:

jobs:
  deploy-documenter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documenter

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './documenter/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Sync and Restart Service on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes"
          REMOTE_DIR="/home/$USER/documenter"

          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p $REMOTE_DIR/public/data $REMOTE_DIR/dist"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./dist/ \
            "$USER@$HOST:$REMOTE_DIR/dist/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./public/data/ \
            "$USER@$HOST:$REMOTE_DIR/public/data/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./package.json \
            ./package-lock.json \
            "$USER@$HOST:$REMOTE_DIR/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ../deploy/systemd/eduardoos-documenter.service \
            "$USER@$HOST:/tmp/eduardoos-documenter.service"

          ssh $SSH_OPTS "$USER@$HOST" bash -s <<EOF
            set -euo pipefail
            REMOTE_DIR="/home/$USER/documenter"

            if [ -d "\$REMOTE_DIR/data/series" ] && [ ! -e "\$REMOTE_DIR/public/data/series" ]; then
              mkdir -p "\$REMOTE_DIR/public/data"
              mv "\$REMOTE_DIR/data/series" "\$REMOTE_DIR/public/data/series"
              rmdir "\$REMOTE_DIR/data" 2>/dev/null || true
            fi

            sudo cp /tmp/eduardoos-documenter.service /etc/systemd/system/eduardoos-documenter.service
            cd "\$REMOTE_DIR"
            npm ci --omit=dev
            sudo systemctl daemon-reload
            sudo systemctl enable eduardoos-documenter
            sudo systemctl restart eduardoos-documenter
            sudo systemctl --no-pager --full status eduardoos-documenter

            curl -sf "http://127.0.0.1:8090/health" >/dev/null \
              || { echo "ERROR: documenter /health check failed"; exit 1; }
            echo "Documenter deploy OK"
          EOF
