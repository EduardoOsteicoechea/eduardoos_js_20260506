name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'deploy/nginx/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Sync to EC2 Nginx Directory
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes"

          ssh $SSH_OPTS "$USER@$HOST" "sudo mkdir -p /var/www/eduardoos.com/dist && sudo chown -R $USER:$USER /var/www/eduardoos.com"

          rsync -avz --delete -e "ssh $SSH_OPTS" \
            ./dist/ \
            "$USER@$HOST:/var/www/eduardoos.com/dist/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ../deploy/nginx/eduardoos.com.conf \
            "$USER@$HOST:/tmp/eduardoos.com.conf"

          ssh $SSH_OPTS "$USER@$HOST" bash -s <<'EOF'
            set -euo pipefail
            sudo cp /tmp/eduardoos.com.conf /etc/nginx/conf.d/eduardoos.com.conf
            sudo nginx -t
            sudo systemctl reload nginx
            echo "Frontend + nginx deploy OK"
          EOF
