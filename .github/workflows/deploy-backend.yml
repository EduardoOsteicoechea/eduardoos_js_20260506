name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/systemd/eduardoos-backend.service'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Sync and Restart Service on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes"
          REMOTE_DIR="/home/$USER/backend"

          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p $REMOTE_DIR/public/data $REMOTE_DIR/dist"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./dist/ \
            "$USER@$HOST:$REMOTE_DIR/dist/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./public/data/ \
            "$USER@$HOST:$REMOTE_DIR/public/data/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./package.json \
            ./package-lock.json \
            "$USER@$HOST:$REMOTE_DIR/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ../deploy/systemd/eduardoos-backend.service \
            "$USER@$HOST:/tmp/eduardoos-backend.service"

          ssh $SSH_OPTS "$USER@$HOST" bash -s <<EOF
            set -euo pipefail
            REMOTE_DIR="/home/$USER/backend"

            if [ ! -f "\$REMOTE_DIR/.env" ]; then
              echo "ERROR: Missing \$REMOTE_DIR/.env on EC2 (create from backend/.env.example)."
              exit 1
            fi

            # Fix older deploys that rsynced public/data into ~/backend/data/
            if [ -d "\$REMOTE_DIR/data/series" ] && [ ! -e "\$REMOTE_DIR/public/data/series" ]; then
              mkdir -p "\$REMOTE_DIR/public/data"
              mv "\$REMOTE_DIR/data/series" "\$REMOTE_DIR/public/data/series"
              rmdir "\$REMOTE_DIR/data" 2>/dev/null || true
            fi

            # Retire legacy Python API (same port 8080)
            if systemctl cat eduardoos-api.service &>/dev/null; then
              sudo systemctl stop eduardoos-api || true
              sudo systemctl disable eduardoos-api || true
            fi

            sudo cp /tmp/eduardoos-backend.service /etc/systemd/system/eduardoos-backend.service
            cd "\$REMOTE_DIR"
            npm ci --omit=dev
            sudo systemctl daemon-reload
            sudo systemctl enable eduardoos-backend
            sudo systemctl restart eduardoos-backend
            sudo systemctl --no-pager --full status eduardoos-backend

            curl -sf "http://127.0.0.1:8080/api/series/catalog" >/dev/null \
              || { echo "ERROR: backend /api/series/catalog did not return JSON"; exit 1; }
            echo "Backend deploy OK"
          EOF
