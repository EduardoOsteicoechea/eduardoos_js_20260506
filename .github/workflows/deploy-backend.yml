name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'database/posts.db'
      - 'deploy/systemd/eduardoos-backend.service'
      - 'deploy/scripts/ec2-node-service.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Sync and Restart Service on EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes"
          REMOTE_DIR="/home/$USER/backend"

          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p $REMOTE_DIR/public/data $REMOTE_DIR/dist"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./dist/ \
            "$USER@$HOST:$REMOTE_DIR/dist/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./public/data/ \
            "$USER@$HOST:$REMOTE_DIR/public/data/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ./package.json \
            ./package-lock.json \
            "$USER@$HOST:$REMOTE_DIR/"

          rsync -avz -e "ssh $SSH_OPTS" \
            ../deploy/systemd/eduardoos-backend.service \
            "$USER@$HOST:/tmp/eduardoos-backend.service"

          rsync -avz -e "ssh $SSH_OPTS" \
            ../deploy/scripts/ec2-node-service.sh \
            "$USER@$HOST:/tmp/ec2-node-service.sh"

          ssh $SSH_OPTS "$USER@$HOST" bash -s <<EOF
            set -euo pipefail
            REMOTE_DIR="/home/$USER/backend"

            if [ ! -f "\$REMOTE_DIR/.env" ]; then
              echo "ERROR: Missing \$REMOTE_DIR/.env on EC2 (create from backend/.env.example)."
              exit 1
            fi

            if [ -d "\$REMOTE_DIR/data/series" ] && [ ! -e "\$REMOTE_DIR/public/data/series" ]; then
              mkdir -p "\$REMOTE_DIR/public/data"
              mv "\$REMOTE_DIR/data/series" "\$REMOTE_DIR/public/data/series"
              rmdir "\$REMOTE_DIR/data" 2>/dev/null || true
            fi

            sudo cp /tmp/eduardoos-backend.service /etc/systemd/system/eduardoos-backend.service

            if systemctl cat eduardoos-database.service &>/dev/null; then
              echo "==> ensure eduardoos-database is running before backend health check"
              sudo systemctl daemon-reload
              sudo systemctl enable eduardoos-database 2>/dev/null || true
              sudo systemctl restart eduardoos-database
              sleep 2
              if ! curl -sf "http://127.0.0.1:8120/health" >/dev/null; then
                echo "WARN: posts-db /health failed — backend will use filesystem fallback until database is up"
                journalctl -u eduardoos-database -n 20 --no-pager || true
              fi
            else
              echo "WARN: eduardoos-database.service not installed yet (run Deploy Database workflow or set up manually)"
            fi

            chmod +x /tmp/ec2-node-service.sh
            /tmp/ec2-node-service.sh \
              "\$REMOTE_DIR" \
              eduardoos-backend \
              8080 \
              "http://127.0.0.1:8080/api/series/catalog" \
              eduardoos-api
          EOF
