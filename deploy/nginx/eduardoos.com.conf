# Reference nginx config for EC2: /etc/nginx/conf.d/eduardoos.com.conf
#
# - Static site: /var/www/eduardoos.com/dist
# - Public API:  /api/*  -> backend :8080  (Express mounts routes at /api)
# - Telemetry:   /api/server/health -> telemetry :8100 (must be before /api/)
# - Documenter:  NOT exposed publicly; backend calls http://127.0.0.1:8090
# - Chatbot:     NOT exposed publicly; backend calls http://127.0.0.1:8110
# - Chat UI:     POST /api/chatbot -> backend :8080 -> chatbot :8110

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name eduardoos.com www.eduardoos.com;

    ssl_certificate /etc/letsencrypt/live/eduardoos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduardoos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/eduardoos.com/dist;
    index index.html;

    # Post editor uploads (images/audio/video)
    client_max_body_size 50M;

    # Telemetry (exact path — more specific than /api/)
    location = /api/server/health {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/server/health/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy typo redirect
    location = /api/server/healt {
        return 301 /api/server/health;
    }

    location = /server/healt {
        return 301 /server/health/;
    }

    # Backend API (keep /api prefix — do NOT use proxy_pass ...8080/ alone)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Optional: /api without trailing slash
    location = /api {
        return 301 /api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name eduardoos.com www.eduardoos.com;
    return 301 https://$host$request_uri;
}
